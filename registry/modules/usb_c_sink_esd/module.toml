id = "usb_c_sink_esd"
module = "UsbCSinkEsd"
version = "1.0.0"
title = "USB-C 2.0 sink with ESD protection"
description = "USB-C receptacle wired as a USB 2.0 sink (UFP): 5.1 kOhm Rd on CC1 and CC2, both D+/D- pairs joined, shield to ground, PRTR5V0U2X ESD clamp on the data lines, a single-line TVS on each CC pin, VBUS bulk capacitor."
tags = ["usb", "usb-c", "esd", "connector", "power-input"]
notes = [
  "D1 and D2 (registry esd_usb) clamp CC1 and CC2: every exposed signal contact gets a clamp, beyond the D+/D- the PRTR5V0U2X covers.",
  "Both CC pins get their own Rd; never tie CC1 and CC2 together.",
  "SBU1/SBU2 are left unconnected for USB 2.0.",
]

[provenance]
source = "USB Type-C Cable and Connector Specification, Release 2.1"
section = "4.5.1.3.2 Sink Power Sub-States; Table 4-24 (Rd = 5.1 kOhm +/-20 %)"
reference_design = "Nexperia PRTR5V0U2X data sheet, application information: USB 2.0 D+/D- protection with VCC on VBUS"
url = "https://assets.nexperia.com/documents/data-sheet/PRTR5V0U2X.pdf"

[[ports]]
name = "vbus"
type = "power"
description = "VBUS from the receptacle, 5 V. Unprotected: fuse it before a long run."
[[ports]]
name = "gnd"
type = "ground"
description = "Ground and shield."
[[ports]]
name = "dp"
type = "bidirectional"
description = "USB D+."
[[ports]]
name = "dn"
type = "bidirectional"
description = "USB D-."

[[params]]
name = "r_cc"
default = "5.1kohm"
fixed = true
description = "Rd on each CC pin. The spec allows +/-20 %; any other value is no longer a sink advertisement."
[[params]]
name = "c_vbus"
default = "4.7uF"
fixed = false
range = "1uF..10uF"
description = "VBUS bulk capacitance. USB 2.0 limits a device's VBUS capacitance to 10 uF at attach."

[[validated]]
case = "fixture.synth"
values = { r_cc = "5.1kohm", c_vbus = "4.7uF" }
