required = true

[[pins]]
name = "mosi"
number = "5"
electrical_type = "input"
capabilities = ["spi_mosi"]
required = true

[[pins]]
name = "sck"
number = "6"
electrical_type = "input"
capabilities = ["spi_sck"]
required = true

[[pins]]
name = "hold"
number = "7"
electrical_type = "input"

[[pins]]
name = "vcc"
number = "8"
