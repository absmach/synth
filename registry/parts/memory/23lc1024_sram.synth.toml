id = "23lc1024_sram"
kind = "memory"
description = "Microchip 23LC1024 1Mbit SPI SRAM, SOIC-8"
kicad_symbol = "Memory_RAM:23LC1024-IST"
kicad_footprint = "Package_SO:SOIC-8_3.9x4.9mm_P1.27mm"

[footprint_dimensions]
width_mm = 6.9
