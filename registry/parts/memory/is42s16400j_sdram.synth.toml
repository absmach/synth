# ISSI IS42S16400J — 64 Mbit SDR SDRAM, 4M x 16, 54-pin TSOP-II.
#
# The registry's first memory with a parallel bus. Everything else here is
# serial — SPI flash, I2C EEPROM — and a serial bus says nothing about length
# matching, which is what #40 case 2 asks a board to demonstrate.
#
# Why this part rather than a DDR3: a DDR3 is a 96-ball FBGA on an 0.8 mm
# grid, and the Class-C FPGA board already measured what the toolchain does
# with a 121-ball 0.8 mm grid. A board that failed on escape routing would be
# answering case 1's question badly instead of case 2's. TSOP-II is two rows
# of peripheral pads at 0.8 mm, which escape without a via at all, so the bus
# geometry is the only hard thing on the board.
#
# All 54 pins are declared and checked both ways against the stock symbol and
# footprint. Every pin but the two NCs is required: an SDRAM with a floating
# address line is not a part that half works, it is a part that reads the
# wrong row.

id = "is42s16400j_sdram"
kind = "memory"
description = "ISSI IS42S16400J 64Mbit SDR SDRAM, 4M x 16, 143MHz, TSOP-II-54"
kicad_symbol = "Memory_RAM:IS42S16400J-xC"
kicad_footprint = "Package_SO:TSOP-II-54_22.2x10.16mm_P0.8mm"
mpn = "IS42S16400J-7TLI"

[footprint_dimensions]
# Courtyard extent of that footprint; the body is 10.16 x 22.2 mm.
width_mm = 13.52
height_mm = 22.72
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 3.0
max_voltage_v = 3.6
# ICC1, the operating supply current the datasheet gives for the -7 grade.
# `max_current_ma` is summed across the loads on a rail and checked against
# the regulator feeding it, so it has to be what this part draws from that
# rail and not a worst case assembled from several specs. VDD and VDDQ are
# separate supplies on the package but sit on one 3.3 V rail on any board
# that uses it, so one figure covers both.
max_current_ma = 90.0


