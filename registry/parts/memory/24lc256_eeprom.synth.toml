id = "24lc256_eeprom"
kind = "memory"
description = "Microchip 24LC256 32KB I²C EEPROM"
mpn = "24LC256-I/SN"
lcsc_pn = "C7611"
kicad_symbol = "Memory_EEPROM:24LC256"
kicad_footprint = "Package_SO:SOIC-8_3.9x4.9mm_P1.27mm"

[footprint_dimensions]
width_mm = 6.9
height_mm = 4.41
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 3.6
max_current_ma = 50.0

# Pin names and numbers come from the stock symbol the part names, which
# extends `24LC16`, cross-checked against the 8 pads of the SOIC-8 footprint.
#
# The previous map had `vdd` on pad 1, `gnd` on 2, `sda` on 3 and `scl` on 4.
# On this package those four pads are A0, A1, A2 and GND, so a board wired to
# this part put its supply on an address pin and its ground on another. The
# four names keep their meaning and move to the pads that carry it.

[[pins]]
name = "a0"
number = "1"
electrical_type = "input"

[[pins]]
name = "a1"
number = "2"
electrical_type = "input"

[[pins]]
name = "a2"
number = "3"
electrical_type = "input"

[[pins]]
name = "gnd"
number = "4"
electrical_type = "power_input"
required = true

[[pins]]
name = "sda"
number = "5"
electrical_type = "bidirectional"
capabilities = ["i2c_sda"]
required = true

[[pins]]
name = "scl"
number = "6"
electrical_type = "input"
capabilities = ["i2c_scl"]
required = true

[[pins]]
name = "wp"
number = "7"
electrical_type = "input"

[[pins]]
name = "vdd"
number = "8"
electrical_type = "power_input"
required = true

[[required_decoupling]]
net = "vdd"
value = "100nf"
count = 1

