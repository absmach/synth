id = "mp2307_buck"
kind = "regulator"
description = "MPS MP2307 3A step-down switching regulator, SO-8"
# `SOIC-8-1EP_3.9x4.9mm_P1.27mm_EP2.4x3.4mm` does not exist in any KiCad
# library, so the export fell back to a synthesized bounding box. This is the
# nearest stock footprint to the MP2307's SOIC8E: same body and pitch, exposed
# pad 2.41 x 3.3 mm. A reviewer should confirm the pad against the datasheet
# before this part is promoted past `experimental`.
kicad_footprint = "Package_SO:SOIC-8-1EP_3.9x4.9mm_P1.27mm_EP2.41x3.3mm"

[footprint_dimensions]
# Courtyard extent of that footprint.
width_mm = 7.4
height_mm = 5.4
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 3.5
max_voltage_v = 15.0
max_current_ma = 800.0

[[pins]]
name = "bs"
number = "1"
electrical_type = "passive"

[[pins]]
name = "in"
number = "2"
electrical_type = "power_input"
required = true

[[pins]]
name = "sw"
number = "3"
electrical_type = "passive"
capabilities = ["switch_node"]
required = true

[[pins]]
name = "gnd"
number = "4"
electrical_type = "power_input"
required = true

[[pins]]
name = "fb"
number = "5"
electrical_type = "input"
capabilities = ["feedback"]
required = true

[[pins]]
name = "comp"
number = "6"
electrical_type = "passive"

[[pins]]
name = "en"
number = "7"
electrical_type = "input"
required = true

[[pins]]
name = "ss"
number = "8"
electrical_type = "passive"

# Pad 9 is the exposed thermal pad, tied to GND on this part. The footprint has
# it, so the pin map has to declare it: an exposed pad left out of the map is a
# short waiting to happen.
[[pins]]
name = "ep"
number = "9"
electrical_type = "power_input"

[[required_decoupling]]
net = "in"
value = "22uf"
count = 1

