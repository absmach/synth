id = "tps22918_loadswitch"
kind = "regulator"
description = "TI TPS22918 2A load switch with quick output discharge"
kicad_footprint = "Package_TO_SOT_SMD:SOT-23-6"

[footprint_dimensions]
width_mm = 5.0
height_mm = 5.0
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 3.5
max_voltage_v = 15.0
max_current_ma = 800.0
max_power_mw = 200
thermal_resistance_c_per_w = 200

[[pins]]
name = "vin"
number = "1"
electrical_type = "power_input"
required = true

[[pins]]
name = "gnd"
number = "2"
electrical_type = "power_input"
required = true

[[pins]]
name = "on"
number = "3"
electrical_type = "input"
required = true

[[pins]]
name = "ct"
number = "4"
electrical_type = "passive"

# Pads 5 and 6 are QOD and VOUT, in that order, per the DBV (SOT-23-6)
# pinout in the datasheet: VIN 1, GND 2, ON 3, CT 4, QOD 5, VOUT 6. `vout`
# was on pad 5, which is the quick-output-discharge terminal the part's own
# description names -- so a board connecting its load to `vout` wired it to
# the discharge pin instead, and `E-SYNTH-QUAL-002` reported pad 6 as having
# no pin at all.
#
# QOD is passive rather than an output. It is a discharge path, strapped to
# VOUT directly or through a resistor to set the rate, so declaring it a
# driver would make the datasheet's own wiring look like two outputs shorted
# together. It is not required: left open, quick discharge is simply off.
[[pins]]
name = "qod"
number = "5"
electrical_type = "passive"

[[pins]]
name = "vout"
number = "6"
electrical_type = "power_output"
required = true

