id = "ssd1306_oled"
kind = "display"
description = "SSD1306 128x64 monochrome OLED driver, I²C"
kicad_footprint = "Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical"

[footprint_dimensions]
width_mm = 5.0
height_mm = 5.0
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 5.0
max_current_ma = 100.0

[[pins]]
name = "vdd"
number = "1"
electrical_type = "power_input"
required = true

[[pins]]
name = "gnd"
number = "2"
electrical_type = "power_input"
required = true

[[pins]]
name = "sda"
number = "3"
electrical_type = "bidirectional"
capabilities = ["i2c_sda"]
required = true

[[pins]]
name = "scl"
number = "4"
electrical_type = "bidirectional"
capabilities = ["i2c_scl"]
required = true

[[required_decoupling]]
net = "vdd"
value = "100nf"
count = 1

