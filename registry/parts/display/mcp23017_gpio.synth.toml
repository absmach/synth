id = "mcp23017_gpio"
kind = "ic"
description = "Microchip MCP23017 16-bit I²C GPIO expander"
kicad_symbol = "Interface_Expansion:MCP23017_SO"
kicad_footprint = "Package_SO:SOIC-28W_7.5x17.9mm_P1.27mm"

[footprint_dimensions]
width_mm = 11.35
height_mm = 17.11
courtyard_margin_mm = 0.25

