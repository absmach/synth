id = "xtal_8mhz"
kind = "crystal"
description = "8MHz quartz crystal, 3.2x2.5mm 4-pin SMD"
# `Device:Crystal` is the two-pin symbol, but this is the four-pad SMD3225
# package: pads 1 and 3 are the crystal, diagonally opposite each other, and
# pads 2 and 4 are the grounded case. `Device:Crystal_GND24` is the symbol that
# says so.
kicad_symbol = "Device:Crystal_GND24"
kicad_footprint = "Crystal:Crystal_SMD_3225-4Pin_3.2x2.5mm"

[footprint_dimensions]
width_mm = 4.2
height_mm = 3.5
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 5.0
max_current_ma = 100.0

[[pins]]
name = "p1"
number = "1"
electrical_type = "passive"

# `p2` was pad 2, which on this package is a case-ground tab, not the second
# terminal. The second terminal is pad 3, diagonally opposite pad 1. The name
# is unchanged so every board that drives `p2` still drives the crystal.
[[pins]]
name = "p2"
number = "3"
electrical_type = "passive"

# The two case tabs. They are copper, they go to ground, and leaving them out
# of the pin map is what let pad 2 be mistaken for a terminal.
[[pins]]
name = "case_1"
number = "2"
electrical_type = "passive"

[[pins]]
name = "case_2"
number = "4"
electrical_type = "passive"

