id = "bg95"
kind = "modem"
version = 0
lifecycle = "active"
description = "Quectel BG95-M3 LTE Cat M1/NB2/EGPRS modem with integrated GNSS, LGA-102"
kicad_symbol = "RF_GSM:BG95-MF"
kicad_footprint = "RF_Module:Quectel_BG95-M3"

[footprint_dimensions]
width_mm = 5.0
height_mm = 5.0
courtyard_margin_mm = 0.25

[operating_conditions]
