capabilities = ["rf_feed"]
required = true

[[pins]]
name = "gnss_ant"
number = "49"
electrical_type = "rf"
capabilities = ["rf_feed"]

[[pins]]
name = "pwrkey"
number = "15"
electrical_type = "input"

[[pins]]
name = "reset_n"
number = "17"
electrical_type = "input"
