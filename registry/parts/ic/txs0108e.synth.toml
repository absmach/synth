id = "txs0108e"
kind = "level_shifter"
description = "TI TXS0108E 8-bit bidirectional voltage level translator"
mpn = "TXS0108EPWR"
lcsc_pn = "C19187"
# `Logic_LevelTranslator:TXS0108E` is in no KiCad library. `TXS0108EPW` is
# the TSSOP variant, which is the package this part's footprint names.
kicad_symbol = "Logic_LevelTranslator:TXS0108EPW"
kicad_footprint = "Package_SO:TSSOP-20_4.4x6.5mm_P0.65mm"

[footprint_dimensions]
width_mm = 6.5
height_mm = 4.4
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.2
max_voltage_v = 5.5
max_current_ma = 50.0

# Pin names and numbers come from the stock KiCad symbol this part names,
# cross-checked against the footprint it names. Pads that the previous map
# got wrong keep their old name where the name still denotes the same pin,
# so a design that referenced one keeps working.

[[pins]]
name = "a1"
number = "1"
electrical_type = "bidirectional"

