id = "w5500_ethernet"
kind = "ic"
description = "WIZnet W5500 hardwired TCP/IP Ethernet controller, LQFP-48"
mpn = "W5500"
lcsc_pn = "C32837"
kicad_symbol = "Interface_Ethernet:W5500"
kicad_footprint = "Package_QFP:LQFP-48_7x7mm_P0.5mm"

[footprint_dimensions]
width_mm = 9.8
height_mm = 9.8
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 5.0
max_current_ma = 100.0

[[pins]]
name = "vcc"
number = "1"
electrical_type = "power_input"
required = true

[[pins]]
name = "gnd"
number = "2"
electrical_type = "power_input"
required = true

[[pins]]
name = "rst_n"
number = "3"
electrical_type = "input"
capabilities = ["reset"]
required = false

[[pins]]
name = "intn"
number = "4"
electrical_type = "open_drain_low"

[[pins]]
name = "scs_n"
number = "5"
electrical_type = "input"
capabilities = ["spi_cs"]
required = true

[[pins]]
name = "sclk"
number = "6"
electrical_type = "input"
capabilities = ["spi_sck"]
required = true

[[pins]]
name = "miso"
number = "7"
electrical_type = "output"
capabilities = ["spi_miso"]
required = true

[[pins]]
name = "mosi"
number = "8"
electrical_type = "input"
capabilities = ["spi_mosi"]
required = true

[[required_decoupling]]
net = "vcc"
value = "100nf"
count = 2

