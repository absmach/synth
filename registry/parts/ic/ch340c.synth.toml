description = "WCH CH340C USB to UART bridge with internal oscillator (no crystal), SOP-16. Pin map checked against KiCad Interface_USB:CH340C. V3 depends on the supply mode: with VCC at 3.3 V tie V3 to VCC, with VCC at 5 V decouple V3 with 100 nF to GND; only the VCC decoupling is modelled, so a 5 V design must add the V3 capacitor itself"
