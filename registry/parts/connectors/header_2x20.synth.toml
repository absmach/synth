id = "header_2x20"
kind = "connector"
description = "2x20 through-hole pin header, 2.54mm pitch, odd-even numbering"
kicad_symbol = "Connector_Generic:Conn_02x20_Odd_Even"
kicad_footprint = "Connector_PinHeader_2.54mm:PinHeader_2x20_P2.54mm_Vertical"

# The courtyard KiCad ships for this footprint: two rows 2.54 mm apart over
# twenty 2.54 mm positions. A dual row carries twice the pins of the 1x20 in
# the same length, which is why a bus wide enough to need forty pins reaches
# the edge of a card without setting the card's size.
[footprint_dimensions]
width_mm = 6.09
height_mm = 51.81
courtyard_margin_mm = 0.25

