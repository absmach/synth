id = "jst_xh_2pin"
kind = "connector"
description = "JST XH-series 2-pin wire-to-board connector, 2.0mm pitch"
kicad_symbol = "Connector_Generic:Conn_01x02"
kicad_footprint = "Connector_JST:JST_XH_S2B-XH-A-1_1x02_P2.50mm_Horizontal"
# The -A-1 variant, which is the footprint this part names.
mpn = "S2B-XH-A-1(LF)(SN)"
lcsc_pn = "C163035"

[footprint_dimensions]
# Courtyard extent of the stock footprint. The previous values were a
# single pad's size, not the connector body, which is what the
# pin-to-footprint check compares against.
width_mm = 8.4
height_mm = 12.5
courtyard_margin_mm = 0.25
# Side-entry (horizontal) footprint: the housing extends toward +y from the
# pad row and the plug enters from that end, read from the footprint outline.
mating_face = "bottom"

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 5.0
max_current_ma = 100.0

[[pins]]
name = "p1"
number = "1"
electrical_type = "passive"

[[pins]]
name = "p2"
number = "2"
electrical_type = "passive"



