id = "jst_ph_3pin"
kind = "connector"
description = "JST PH-series 3-pin wire-to-board connector, 2.0mm pitch"
kicad_symbol = "Connector_Generic:Conn_01x03"
kicad_footprint = "Connector_JST:JST_PH_S3B-PH-K_1x03_P2.00mm_Horizontal"
mpn = "S3B-PH-K-S(LF)(SN)"
lcsc_pn = "C157929"

[footprint_dimensions]
# Courtyard extent of the stock footprint. The previous values were a
# single pad's size, not the connector body, which is what the
# pin-to-footprint check compares against.
width_mm = 8.9
height_mm = 8.6
courtyard_margin_mm = 0.25
# Side-entry (horizontal) footprint: the housing extends toward +y from the
# pad row and the plug enters from that end, read from the footprint outline.
mating_face = "bottom"
# Mating plane: the JST PH S3B-PH-K body front on F.Fab, 6.25 mm from the
# footprint origin along the mating face. The stock courtyard runs 0.5 mm
# past it, so a courtyard-flush part has its plane 0.5 mm in. The range
# allows that recess and up to 0.5 mm overhang; deeper recesses fail.
mating_plane_offset_mm = 6.25
mating_overhang_mm = [-0.5, 0.5]

# JST PH series ratings: 100 V AC/DC and 2 A (AWG #24 wire) as listed by distributors
# (LCSC C131339, element14) and on a mirror of the JST PH series datasheet; the
# JST datasheet itself was not retrieved. The earlier 1.8 to 5 V, 100 mA envelope
# was not the connector's rating.
[operating_conditions]
min_voltage_v = 0.0
max_voltage_v = 100.0
max_current_ma = 2000.0

[[pins]]
name = "p1"
number = "1"
electrical_type = "passive"

[[pins]]
name = "p2"
number = "2"
electrical_type = "passive"

[[pins]]
name = "p3"
number = "3"
electrical_type = "passive"

[provenance]
source = "seed"
reviewed_by = "synth-seed-review"
reviewed_at = "2026-11-13"
