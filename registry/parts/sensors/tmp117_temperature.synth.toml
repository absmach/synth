id = "tmp117_temperature"
kind = "sensor"
description = "TI TMP117 high-accuracy temperature sensor, I²C"
kicad_symbol = "Sensor_Temperature:TMP117xxDRV"
# The symbol the part names is `TMP117xxDRV`, and DRV is TI's code for the
# 2.00 x 2.00 mm six-pin WSON with an exposed pad. The footprint said
# `SOT-563`, a 1.6 x 1.2 mm leaded package that is a different part in a
# different body, so every exported land, pad position and courtyard was
# taken from the wrong outline.
#
# The exposed pad is pad 7 of that footprint and is deliberately NOT declared
# here, which leaves `E-SYNTH-QUAL-002` reporting it. It cannot be declared:
# `TMP117xxDRV` extends `TMP102xxDRL`, which declares pins 1 to 6, and the
# registry loader requires every declared pin number to exist in the symbol as
# well as the footprint -- so a pin for pad 7 makes the whole registry fail to
# load. A part whose exposed pad is absent from the stock symbol has no way to
# cover that pad today. Compare `ina3221_power_monitor`, whose `ep` on pad 17
# is declarable only because the `INA3221` symbol happens to carry pin 17.
kicad_footprint = "Package_SON:WSON-6-1EP_2x2mm_P0.65mm_EP1x1.6mm"

[footprint_dimensions]
width_mm = 2.0
height_mm = 2.0
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 5.0
max_current_ma = 100.0

[[pins]]
name = "vdd"
number = "5"
electrical_type = "power_input"
required = true

[[pins]]
name = "gnd"
number = "2"
electrical_type = "power_input"
required = true

[[pins]]
name = "sda"
number = "6"
electrical_type = "bidirectional"
capabilities = ["i2c_sda"]
required = true

[[pins]]
name = "scl"
number = "1"
electrical_type = "bidirectional"
capabilities = ["i2c_scl"]
required = true

# `Package_TO_SOT_SMD:SOT-563` has six copper pads; pads 3 and 4 were the two
# with no pin to own them. Names and types come from the stock symbol
# `Sensor_Temperature:TMP117xxDRV`, which extends `TMP102xxDRL`. The four pads
# the part already declared were on the right pins.
[[pins]]
name = "alert"
number = "3"
electrical_type = "open_drain_low"

[[pins]]
name = "add0"
number = "4"
electrical_type = "input"

[[pins]]
name = "ep"
number = "7"
electrical_type = "passive"
footprint_only = true

[[required_decoupling]]
net = "vdd"
value = "100nf"
count = 1

