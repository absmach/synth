id = "tmp117_temperature"
kind = "sensor"
description = "TI TMP117 high-accuracy temperature sensor, I²C"
kicad_symbol = "Sensor_Temperature:TMP117xxDRV"
kicad_footprint = "Package_TO_SOT_SMD:SOT-563"

[footprint_dimensions]
width_mm = 1.6
height_mm = 1.6
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 5.0
max_current_ma = 100.0

[[pins]]
name = "vdd"
number = "5"
electrical_type = "power_input"
required = true

[[pins]]
name = "gnd"
number = "2"
electrical_type = "power_input"
required = true

[[pins]]
name = "sda"
number = "6"
electrical_type = "bidirectional"
capabilities = ["i2c_sda"]
required = true

[[pins]]
name = "scl"
number = "1"
electrical_type = "bidirectional"
capabilities = ["i2c_scl"]
required = true

[[required_decoupling]]
net = "vdd"
value = "100nf"
count = 1

