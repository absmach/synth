id = "apds9301_lux"
kind = "sensor"
description = "Broadcom APDS-9301 ambient light sensor, I²C"
kicad_symbol = "Sensor_Optical:APDS-9301"
kicad_footprint = "OptoDevice:Broadcom_APDS-9301"

# Body from the footprint's F.Fab outline; its courtyard is 3.1 x 3.8 mm.
[footprint_dimensions]
width_mm = 2.2
height_mm = 2.6
courtyard_margin_mm = 0.45

[operating_conditions]
min_voltage_v = 2.7
max_voltage_v = 3.6
max_current_ma = 0.6

# Pin numbers, names and electrical types are the stock KiCad symbol's
# (`Sensor_Optical:APDS-9301`), not transcribed by hand. The footprint is the
# one that symbol names in its own `Footprint` property and `ki_fp_filters`.
[[pins]]
name = "vdd"
number = "1"
electrical_type = "power_input"
required = true

[[pins]]
name = "gnd"
number = "2"
electrical_type = "power_input"
required = true

# Address select: low 0x29, float 0x39, high 0x49. An input, so it has to be
# strapped; left floating the device has no defined address.
[[pins]]
name = "adr_sel"
number = "3"
electrical_type = "input"
required = true

[[pins]]
name = "scl"
number = "4"
electrical_type = "input"
capabilities = ["i2c_scl"]
required = true

[[pins]]
name = "sda"
number = "5"
electrical_type = "bidirectional"
capabilities = ["i2c_sda"]
required = true

# Level-interrupt output, open-drain and active low. Optional: the device is
# usable polled, and nothing on a board has to read it.
[[pins]]
name = "int"
number = "6"
electrical_type = "open_drain_low"

[[required_decoupling]]
net = "vdd"
value = "100nf"
count = 1
