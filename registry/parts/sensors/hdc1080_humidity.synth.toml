id = "hdc1080_humidity"
kind = "sensor"
description = "TI HDC1080 humidity/temp sensor, I²C"
mpn = "HDC1080DMBR"
lcsc_pn = "C80854"
kicad_symbol = "Sensor_Humidity:HDC1080"
kicad_footprint = "Package_SON:Texas_PWSON-N6"

[footprint_dimensions]
width_mm = 3.0
height_mm = 3.0
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 5.0
max_current_ma = 100.0

[[pins]]
name = "vdd"
number = "5"
electrical_type = "power_input"
required = true

[[pins]]
name = "gnd"
number = "2"
electrical_type = "power_input"
required = true

[[pins]]
name = "sda"
number = "1"
electrical_type = "bidirectional"
capabilities = ["i2c_sda"]
required = true

[[pins]]
name = "scl"
number = "6"
electrical_type = "bidirectional"
capabilities = ["i2c_scl"]
required = true

# Pins 3, 4 and the die-attach pad carry copper in `Texas_PWSON-N6`, so they
# are declared: a thermal pad left out of the pin map is a short waiting to
# happen. All three are no-connects on the stock `Sensor_Humidity:HDC1080`
# symbol, and the DAP is left floating rather than tied.
[[pins]]
name = "nc"
number = "3"
electrical_type = "do_not_connect"

[[pins]]
name = "nc_2"
number = "4"
electrical_type = "do_not_connect"

[[pins]]
name = "dap"
number = "7"
electrical_type = "do_not_connect"

[[required_decoupling]]
net = "vdd"
value = "100nf"
count = 1

