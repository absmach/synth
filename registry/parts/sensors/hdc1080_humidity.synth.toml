id = "hdc1080_humidity"
kind = "sensor"
description = "TI HDC1080 humidity/temp sensor, I²C"
mpn = "HDC1080DMBR"
lcsc_pn = "C80854"
kicad_symbol = "Sensor_Humidity:HDC1080"
kicad_footprint = "Package_SON:WSON-6-1EP_3x3mm_P0.95mm_EP1.5x2.4mm"

[footprint_dimensions]
width_mm = 3.0
height_mm = 3.0
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
