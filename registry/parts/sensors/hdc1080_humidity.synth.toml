required = true

[[pins]]
name = "sda"
number = "1"
electrical_type = "bidirectional"
capabilities = ["i2c_sda"]
required = true

[[pins]]
name = "scl"
number = "6"
electrical_type = "bidirectional"
capabilities = ["i2c_scl"]
required = true

[[required_decoupling]]
net = "vdd"
value = "100nf"
count = 1

