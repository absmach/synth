id = "mpu6050_imu"
kind = "sensor"
description = "InvenSense MPU-6050 6-axis IMU (accel+gyro), I²C"
mpn = "MPU-6050"
lcsc_pn = "C24116"
kicad_symbol = "Sensor_Motion:MPU-6050"
kicad_footprint = "Package_DFN_QFN:QFN-24-1EP_4x4mm_P0.5mm_EP2.7x2.7mm"

[footprint_dimensions]
width_mm = 4.0
height_mm = 4.0
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
