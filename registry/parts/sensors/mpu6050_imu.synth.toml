id = "mpu6050_imu"
kind = "sensor"
description = "InvenSense MPU-6050 6-axis IMU (accel+gyro), I²C"
mpn = "MPU-6050"
lcsc_pn = "C24116"
kicad_symbol = "Sensor_Motion:MPU-6050"
# The InvenSense footprint, which the stock MPU-6050 symbol names: 24 pads
# and a keepout over the die paddle, which is not soldered. The generic
# QFN-24-1EP named before put a 25th pad under the package.
kicad_footprint = "Sensor_Motion:InvenSense_QFN-24_4x4mm_P0.5mm"

[footprint_dimensions]
width_mm = 4.0
height_mm = 4.0
courtyard_margin_mm = 0.25

# VDD 2.375-3.46 V (PS-MPU-6000A rev 3.1, section 3, "Primary Differences
# between MPU-6000 and MPU-6050"); VLOGIC may go to
# 1.71 V but never above VDD. The 5.0 V maximum recorded before would have
# accepted a rail that damages the part.
[operating_conditions]
min_voltage_v = 2.375
max_voltage_v = 3.46
max_current_ma = 100.0

# Pin names and numbers come from the stock KiCad symbol this part names,
# cross-checked against the footprint it names. Pads that the previous map
# got wrong keep their old name where the name still denotes the same pin,
# so a design that referenced one keeps working.

[[pins]]
name = "clkin"
number = "1"
electrical_type = "input"

[[pins]]
name = "nc"
number = "2"
electrical_type = "do_not_connect"

[[pins]]
name = "nc_2"
number = "3"
electrical_type = "do_not_connect"

[[pins]]
name = "nc_3"
number = "4"
electrical_type = "do_not_connect"

[[pins]]
name = "nc_4"
number = "5"
electrical_type = "do_not_connect"

[[pins]]
name = "aux_da"
number = "6"
electrical_type = "bidirectional"

[[pins]]
name = "aux_cl"
number = "7"
electrical_type = "output"

[[pins]]
name = "vlogic"
number = "8"
electrical_type = "power_input"

[[pins]]
name = "ad0"
number = "9"
electrical_type = "input"

[[pins]]
name = "regout"
number = "10"
electrical_type = "passive"

[[pins]]
name = "fsync"
number = "11"
electrical_type = "input"

[[pins]]
name = "int"
number = "12"
electrical_type = "output"

[[pins]]
name = "vdd"
number = "13"
electrical_type = "power_input"
required = true

[[pins]]
name = "nc_5"
number = "14"
electrical_type = "do_not_connect"

[[pins]]
name = "nc_6"
number = "15"
electrical_type = "do_not_connect"

[[pins]]
name = "nc_7"
number = "16"
electrical_type = "do_not_connect"

[[pins]]
name = "nc_8"
number = "17"
electrical_type = "do_not_connect"

[[pins]]
name = "gnd"
number = "18"
electrical_type = "power_input"
required = true

[[pins]]
name = "resv"
number = "19"
electrical_type = "do_not_connect"

[[pins]]
name = "cpout"
number = "20"
electrical_type = "passive"

[[pins]]
name = "resv_2"
number = "21"
electrical_type = "do_not_connect"

# CLKOUT, the system clock output (PS-MPU-6000A rev 3.1, section 7.1). The
# stock symbol marks pin 22 reserved, but the datasheet reserves only 19 and
# 21; leaving it unconnected is still fine.
[[pins]]
name = "clkout"
number = "22"
electrical_type = "output"

[[pins]]
name = "scl"
number = "23"
electrical_type = "input"
capabilities = ["i2c_scl"]
required = true

[[pins]]
name = "sda"
number = "24"
electrical_type = "bidirectional"
capabilities = ["i2c_sda"]
required = true

[[required_decoupling]]
net = "vdd"
value = "100nf"
count = 1

