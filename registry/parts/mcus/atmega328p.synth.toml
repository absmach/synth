number = "10"
electrical_type = "bidirectional"
capabilities = ["gpio"]

[[pins]]
name = "pd5"
number = "11"
electrical_type = "bidirectional"
capabilities = ["gpio"]

[[pins]]
name = "pd6"
number = "12"
electrical_type = "bidirectional"
capabilities = ["gpio"]

[[pins]]
name = "pd7"
number = "13"
electrical_type = "bidirectional"
capabilities = ["gpio"]

[[pins]]
name = "pb0"
number = "14"
electrical_type = "bidirectional"
capabilities = ["gpio"]

[[pins]]
