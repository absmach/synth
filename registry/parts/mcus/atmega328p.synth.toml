id = "atmega328p"
kind = "mcu"
description = "Microchip ATmega328P AVR @ 20MHz, 32KB flash — the Arduino Uno MCU"
mpn = "ATMEGA328P-AU"
lcsc_pn = "C14877"
kicad_symbol = "MCU_Microchip_ATmega:ATmega328P-P"
kicad_footprint = "Package_DIP:DIP-28_W7.62mm"

[footprint_dimensions]
width_mm = 9.73
height_mm = 36.08
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 5.5
max_current_ma = 200.0

# Full DIP-28 pin map from the Microchip ATmega328P datasheet (DS40002061)
# Pin Configurations, cross-checked against KiCad's
# MCU_Microchip_ATmega:ATmega328P-P symbol. Every pad of the footprint is
# declared: an undeclared pad is a routing and netlist hazard
# (E-SYNTH-QUAL-002).

# --- Power ---------------------------------------------------------------

[[pins]]
name = "vcc"
number = "7"
electrical_type = "power_input"
required = true

[[pins]]
name = "gnd"
number = "8"
electrical_type = "power_input"
required = true

[[pins]]
name = "avcc"
number = "20"
electrical_type = "power_input"
required = true

[[pins]]
name = "aref"
number = "21"
electrical_type = "passive"

[[pins]]
name = "gnd_2"
number = "22"
electrical_type = "power_input"
required = true

# --- Reset ---------------------------------------------------------------

[[pins]]
name = "reset"
number = "1"
electrical_type = "input"
capabilities = ["reset"]
required = true

