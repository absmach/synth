id = "esp32_c3_mini"
kind = "mcu"
description = "Espressif ESP32-C3-MINI-1 RISC-V Wi-Fi/BLE 5 module, PCB antenna, 13.2 x 16.6 mm LGA-53"
mpn = "ESP32-C3-MINI-1-N4"
lcsc_pn = "C2834457"
# KiCad 10 ships no ESP32-C3-MINI-1 symbol, so none is named: the exporter
# draws one from the pins below, which is truer than borrowing the C6-MINI-1
# symbol and printing its IO names on a C3.
#
# The footprint is the stock ESP32-C6-MINI-1. Espressif gives the two modules
# the same recommended land pattern (C3-MINI-1 datasheet v2.2 Figure 11-1, C6-MINI-1
# datasheet v1.5 Figure 11-1: 13.2 x 16.6 mm, 48 x 0.8 x 0.4 mm pads, 4 x 0.7 mm
# corner pads, a 5.4 mm centre pad) and the same pin numbering, 1-11 down the
# left, 12-24 along the bottom, 25-35 up the right, 36-48 across the top,
# 49 the centre pad and 50-53 the corners.
#
# Pins are from Table 3-1 of the ESP32-C3-MINI-1 datasheet
# (https://www.espressif.com/sites/default/files/documentation/esp32-c3-mini-1_datasheet_en.pdf).
# The ESP32-C3 routes I2C through its GPIO matrix, so every general-purpose
# pin can be either I2C role and declares both (as ice40hx4k_bg121 does).
#
# USB D- and D+ are GPIO18 and GPIO19 on this silicon, so they are capabilities
# of pins 26 and 27; the previous map invented separate pins 20 and 21 for
# them and put vdd, en, io9, io18 and io19 on pads that carry something else.
kicad_footprint = "RF_Module:ESP32-C6-MINI-1"

[footprint_dimensions]
width_mm = 13.2
height_mm = 16.6
courtyard_margin_mm = 0.25

# VDD33 3.0-3.6 V (Table 6-2); 350 mA is the 802.11b TX peak (Table 6-4).
[operating_conditions]
min_voltage_v = 3.0
max_voltage_v = 3.6
max_current_ma = 350.0

[[pins]]
name = "gnd"
number = "1"
electrical_type = "power_input"
required = true

