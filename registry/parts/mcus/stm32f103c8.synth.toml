id = "stm32f103c8"
kind = "mcu"
description = "STM32F103C8T6 ARM Cortex-M3 @ 72MHz, 64KB flash, LQFP-48 — the bluepill MCU"
mpn = "STM32F103C8T6"
lcsc_pn = "C8734"
kicad_symbol = "MCU_ST_STM32F1:STM32F103C8Tx"
kicad_footprint = "Package_QFP:LQFP-48_7x7mm_P0.5mm"

[footprint_dimensions]
width_mm = 9.8
height_mm = 9.8
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 3.6
max_current_ma = 150.0
max_power_mw = 200
thermal_resistance_c_per_w = 50

# Full LQFP-48 pin map from the ST STM32F103x8 datasheet (DS5319) Table 5,
# cross-checked against KiCad's MCU_ST_STM32F1:STM32F103C8Tx symbol. Every
# pad of the footprint is declared: an undeclared pad is a routing and
# netlist hazard (E-SYNTH-QUAL-002).

# --- Power ---------------------------------------------------------------

[[pins]]
name = "vbat"
number = "1"
electrical_type = "power_input"
required = true

[[pins]]
name = "vssa"
number = "8"
electrical_type = "power_input"
required = true

[[pins]]
