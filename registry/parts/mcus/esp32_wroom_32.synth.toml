id = "esp32_wroom_32"
kind = "mcu"
description = "Espressif ESP32-WROOM-32 module — dual-core Xtensa LX6 with Wi-Fi/BT"
mpn = "ESP32-WROOM-32"
lcsc_pn = "C82899"
kicad_symbol = "RF_Module:ESP32-WROOM-32"
kicad_footprint = "RF_Module:ESP32-WROOM-32"

[footprint_dimensions]
width_mm = 19.0
height_mm = 17.41
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 3.6
max_current_ma = 150.0

[[pins]]
name = "gnd"
number = "1"
electrical_type = "power_input"
required = true

[[pins]]
name = "vdd"
number = "2"
electrical_type = "power_input"
required = true

[[pins]]
name = "en"
number = "3"
electrical_type = "input"
capabilities = ["reset"]
required = true

[[pins]]
name = "io0"
number = "25"
electrical_type = "bidirectional"
capabilities = ["gpio", "boot_mode"]

[[pins]]
name = "io1_tx"
number = "35"
electrical_type = "bidirectional"
capabilities = ["gpio", "uart_tx"]

[[pins]]
name = "io3_rx"
number = "34"
electrical_type = "bidirectional"
capabilities = ["gpio", "uart_rx"]

[[pins]]
name = "io21_sda"
number = "33"
electrical_type = "bidirectional"
capabilities = ["gpio", "i2c_sda"]

[[pins]]
name = "io22_scl"
number = "36"
electrical_type = "bidirectional"
capabilities = ["gpio", "i2c_scl"]

# The rest of the module's pads. Names and numbers come from the stock
# symbol `RF_Module:ESP32-WROOM-32`, cross-checked against the 39 pads of
# the footprint of the same name, so the pin map can be checked against the
# package instead of trusted. Pads 15, 38 and 39 are the module's ground
# tabs and pad 32 is the datasheet's NC.
#
# The SPI capabilities sit on IO5/18/19/23, which is the VSPI mapping the
# module's own datasheet uses. Nothing here is marked `required`, so no
# existing design is retroactively rejected.

[[pins]]
name = "sensor_vp"
number = "4"
electrical_type = "input"
capabilities = ["gpio"]

