id = "stm32g030"
kind = "mcu"
description = "STMicro STM32G030F6 ARM Cortex-M0+ @ 64MHz, low-cost, TSSOP-20"
mpn = "STM32G030C8T6"
lcsc_pn = "C5165977"
kicad_symbol = "MCU_ST_STM32G0:STM32G030K8Tx"
kicad_footprint = "Package_QFP:LQFP-32_7x7mm_P0.8mm"

[footprint_dimensions]
width_mm = 9.85
height_mm = 9.85
courtyard_margin_mm = 0.25

[operating_conditions]
min_voltage_v = 1.8
max_voltage_v = 3.6
max_current_ma = 150.0

# Pin names and numbers come from the stock symbol
# `MCU_ST_STM32G0:STM32G030K8Tx`, which extends `STM32G030K_6-8_Tx`,
# cross-checked against the 32 pads of `Package_QFP:LQFP-32_7x7mm_P0.8mm`.
#
# The previous map declared 7 of 32 pads and had every one of them on the
# wrong pad: `vdd` on 5 (which is VSS), `nrst` on 4 (VDD), `vss` on 16 (PB1),
# `pa2` on 8 (PA1), `pa3` on 9 (PA2), `pa9` on 17 (PB2) and `pa10` on 18
# (PA8). The names boards already use are kept and moved to the pads that
# carry them, so `U2.vdd` still means the supply.
#
# PA9/PA10 are the K-package's remapped pins, on pads 22 and 23; pads 19 and
# 21 are the NC pads that remapping leaves behind.

[[pins]]
name = "pb9"
number = "1"
electrical_type = "bidirectional"
capabilities = ["gpio"]

[[pins]]
name = "pc14"
number = "2"
electrical_type = "bidirectional"
capabilities = ["gpio"]

[[pins]]
name = "pc15"
number = "3"
electrical_type = "bidirectional"
capabilities = ["gpio"]

[[pins]]
name = "vdd"
number = "4"
electrical_type = "power_input"
required = true

[[pins]]
name = "vss"
number = "5"
electrical_type = "power_input"
required = true

[[pins]]
name = "nrst"
number = "6"
electrical_type = "input"
capabilities = ["reset"]
required = true

[[pins]]
name = "pa0"
number = "7"
electrical_type = "bidirectional"
capabilities = ["gpio"]

