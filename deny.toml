# cargo-deny configuration. Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
unsound = "none"
unmaintained = "none"

[licenses]
version = 2
private = { ignore = true }
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  # webpki-roots (Rustls trust store, pulled in via reqwest/hyper-rustls)
  # relicensed to the Community Data License Agreement Permissive 2.0 — a
  # permissive license (data-side analogue of MIT/Apache-2.0).
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
