name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  CARGO_HTTP_TIMEOUT: 60

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build
    # The container is the toolchain pin: KiCad 10.0.8, the version the
    # matrix was measured on, with no PPA or archive in the path.
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0.8-full
      options: --user root
    env:
      # GitHub mounts /github/home for the step user; the container runs as
      # root, so rustup otherwise refuses with "$HOME differs from euid home".
      HOME: /root
      KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
      KICAD_SYMBOL_DIR: /usr/share/kicad/symbols

    steps:
      # The image is pinned to the KiCad version the matrix was measured on, so
      # no PPA, Launchpad API or apt archive can change the tool under us.
      - name: Install checkout and build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 python3-pip build-essential pkg-config libssl-dev default-jre-headless

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Assert the KiCad version and library tables
        run: |
          test "$(kicad-cli version)" = "10.0.8"
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test the KiCadRoutingTools adapter
        run: python3 tools/test_kicad_routing_tools_route.py

      - name: Run linter
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build release
        if: github.event_name != 'pull_request'
        run: cargo build --workspace --release --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  test:
    name: Test shard ${{ matrix.shard }}/3
    # The container is the toolchain pin: KiCad 10.0.8, the version the
    # matrix was measured on, with no PPA or archive in the path.
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0.8-full
      options: --user root
    env:
      # GitHub mounts /github/home for the step user; the container runs as
      # root, so rustup otherwise refuses with "$HOME differs from euid home".
      HOME: /root
      KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
      KICAD_SYMBOL_DIR: /usr/share/kicad/symbols

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      # The image is pinned to the KiCad version the matrix was measured on, so
      # no PPA, Launchpad API or apt archive can change the tool under us.
      - name: Install checkout and build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 python3-pip build-essential pkg-config libssl-dev default-jre-headless

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Assert the KiCad version and library tables
        run: |
          test "$(kicad-cli version)" = "10.0.8"
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests (shard ${{ matrix.shard }})
        run: |
          cargo nextest run --workspace --locked \
            --partition count:${{ matrix.shard }}/3

      - name: Run doctests
        if: matrix.shard == 1
        run: cargo test --workspace --locked --doc

  # The unrouted-net no-regression gate is the only signal that a placement
  # change did not make routing worse; distance metrics (HPWL, member-to-anchor
  # distance) all improved while routability regressed. It needs release mode
  # and is `#[ignore]`d, so the sharded debug run above skips it. Run it here so
  # every PR is gated. The smaller debug-mode check in
  # `crates/synth-route/tests/routability_report.rs` runs in the matrix above.
  routability-gate:
    name: Routability Gate (release)
    # The container is the toolchain pin: KiCad 10.0.8, the version the
    # matrix was measured on, with no PPA or archive in the path.
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0.8-full
      options: --user root
    env:
      # GitHub mounts /github/home for the step user; the container runs as
      # root, so rustup otherwise refuses with "$HOME differs from euid home".
      HOME: /root
      KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
      KICAD_SYMBOL_DIR: /usr/share/kicad/symbols

    steps:
      # The image is pinned to the KiCad version the matrix was measured on, so
      # no PPA, Launchpad API or apt archive can change the tool under us.
      - name: Install checkout and build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 python3-pip build-essential pkg-config libssl-dev default-jre-headless

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-routability-${{ hashFiles('rust-toolchain.toml') }}

      - name: Assert the KiCad version and library tables
        run: |
          test "$(kicad-cli version)" = "10.0.8"
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Run unrouted-net no-regression gate
        run: |
          cargo test --release -p synth-route --test routability_report \
            unrouted_nets_do_not_regress --locked -- --ignored --nocapture
