name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  CARGO_HTTP_TIMEOUT: 60

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build
    # The container is the toolchain pin: KiCad 10.0.8, the version the
    # matrix was measured on, with no PPA or archive in the path.
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0.8-full
      # --init puts a reaper at PID 1. Without it a killed grandchild stays a
      # zombie, `kill -0` still finds it, and the process-timeout tests fail.
      options: --user root --init
    env:
      # GitHub mounts /github/home for the step user; the container runs as
      # root, so rustup otherwise refuses with "$HOME differs from euid home".
      HOME: /root
      KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
      KICAD_SYMBOL_DIR: /usr/share/kicad/symbols

    steps:
      # The image is pinned to the KiCad version the matrix was measured on, so
      # no PPA, Launchpad API or apt archive can change the tool under us.
      - name: Install checkout and build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 python3-pip build-essential pkg-config libssl-dev default-jre-headless

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Assert the KiCad version and library tables
        run: |
          test "$(kicad-cli version)" = "10.0.8"
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test the KiCadRoutingTools adapter
        run: python3 tools/test_kicad_routing_tools_route.py

      - name: Run linter
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build release
        if: github.event_name != 'pull_request'
        run: cargo build --workspace --release --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  test:
    name: Test shard ${{ matrix.shard }}/3
    # The container is the toolchain pin: KiCad 10.0.8, the version the
    # matrix was measured on, with no PPA or archive in the path.
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0.8-full
      # --init puts a reaper at PID 1. Without it a killed grandchild stays a
      # zombie, `kill -0` still finds it, and the process-timeout tests fail.
      options: --user root --init
    env:
      # GitHub mounts /github/home for the step user; the container runs as
      # root, so rustup otherwise refuses with "$HOME differs from euid home".
      HOME: /root
      KICAD_FOOTPRINT_DIR: /usr/share/kicad/footprints
      KICAD_SYMBOL_DIR: /usr/share/kicad/symbols

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      # The image is pinned to the KiCad version the matrix was measured on, so
      # no PPA, Launchpad API or apt archive can change the tool under us.
      - name: Install checkout and build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 python3-pip build-essential pkg-config libssl-dev default-jre-headless

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Assert the KiCad version and library tables
        run: |
          test "$(kicad-cli version)" = "10.0.8"
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install ngspice
        run: apt-get update && apt-get install -y --no-install-recommends ngspice

      - name: Run tests (shard ${{ matrix.shard }})
        run: |
          cargo nextest run --workspace --locked \
            --partition count:${{ matrix.shard }}/3

      - name: Run doctests
        if: matrix.shard == 1
        run: cargo test --workspace --locked --doc
  # Which release paths a pull request touched (#45). The qualification matrix
  # is expensive — it routes and exports real reference boards — so it runs on
  # the changes that could move a release verdict: the compiler, the part
  # registry, placement and layout, the routers, the KiCad export, and the
  # release/gate surface itself. A job-level check, not a workflow-level
  # `paths:` filter, so the lint, test and routability jobs keep running on
  # every pull request.
  changed-release-paths:
    name: Release paths changed?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.paths.outputs.release }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # The pull request's merge base, so the diff is the PR's own change.
          fetch-depth: 0

      - name: Detect changed release paths
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "${BASE}...${GITHUB_SHA}")"
          if printf '%s\n' "$files" | grep -Eq \
            '^(crates/synth-(ast|ir|parser|validate|registry|layout|place|geometry|route|router|pcb|kicad|drc|cli)/|registry/|qualification/|scripts/run_qualification_matrix\.py|Cargo\.lock$|rust-toolchain\.toml$|\.github/)'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "release paths changed:"
            printf '%s\n' "$files" | grep -E \
              '^(crates/synth-(ast|ir|parser|validate|registry|layout|place|geometry|route|router|pcb|kicad|drc|cli)/|registry/|qualification/|scripts/run_qualification_matrix\.py|Cargo\.lock$|rust-toolchain\.toml$|\.github/)' || true
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # The release-blocking reference-board matrix (#45): every versioned row of
  # `qualification/matrix.toml` runs the same `synth check` gate a release
  # runs, against the expectations the corpus declares, with KiCadRoutingTools
  # pinned so each verdict names the engine that produced it. Negative rows
  # must fail at the source gate, so a compiler change cannot silently widen
  # what a board may declare. Results and the per-row records are uploaded on
  # failure for human review; what the matrix cannot prove — visual, assembly,
  # SI/PI, thermal and fabrication checks — stays with the reviewers and is
  # documented in docs/qualification-matrix.md.
  qualification-matrix:
    name: Qualification Matrix (release)
    needs: changed-release-paths
    # `always()` so the matrix still runs on push and dispatch, where the
    # paths job above is skipped: a skipped `needs` job would otherwise skip
    # this one too.
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request' ||
          needs.changed-release-paths.outputs.release == 'true')
      }}
    # Pinned, not ubuntu-latest: see the other jobs' note about KiCad 10.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-matrix-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache KiCad apt packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/synth-apt
          key: ${{ runner.os }}-kicad-apt-${{ hashFiles('.github/scripts/install-kicad.sh') }}
          restore-keys: |
            ${{ runner.os }}-kicad-apt-

      - name: Install kicad-cli and the stock symbol/footprint libraries
        run: .github/scripts/install-kicad.sh

      - name: Cache routing engines
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/synth/kicad-routing-tools
            tools/freerouting
          key: ${{ runner.os }}-routing-engines-${{ hashFiles('scripts/setup-routing-engines.sh') }}
          restore-keys: |
            ${{ runner.os }}-routing-engines-

      - name: Install the routing engines the corpus records
        run: scripts/setup-routing-engines.sh

      - name: Pin KiCadRoutingTools to the revision the corpus was routed with
        run: |
          set -euo pipefail
          repo="${XDG_DATA_HOME:-$HOME/.local/share}/synth/kicad-routing-tools"
          git -C "$repo" fetch --depth 1 origin 9399bfb29e072bfe60b10d9cdae20c274fc2a17a
          git -C "$repo" checkout 9399bfb29e072bfe60b10d9cdae20c274fc2a17a
          git -C "$repo" rev-parse HEAD

      - name: Build the release gate binary
        run: cargo build --release -p synth-cli --locked

      - name: Run the qualification matrix
        id: matrix
        run: |
          python3 scripts/run_qualification_matrix.py \
            --synth target/release/synth \
            --out qualification-matrix-results

      - name: Upload the matrix results for review
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-matrix-results
          path: qualification-matrix-results/
          if-no-files-found: error
          retention-days: 14
