name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  CARGO_HTTP_TIMEOUT: 60

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and Build
    # Pinned, not ubuntu-latest: that label is moving to 26.04 (resolute), whose
    # apt reads the KiCad 10 PPA through its amd64v3 index, which carries no
    # KiCad, so it offers the archive's 9.0 and install-kicad.sh rightly
    # refuses it. Move once 26.04 resolves KiCad 10 from the PPA.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache KiCad apt packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/synth-apt
          key: ${{ runner.os }}-kicad-apt-${{ hashFiles('.github/scripts/install-kicad.sh') }}
          restore-keys: |
            ${{ runner.os }}-kicad-apt-

      - name: Install kicad-cli and the stock symbol/footprint libraries
        run: .github/scripts/install-kicad.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test the KiCadRoutingTools adapter
        run: python3 tools/test_kicad_routing_tools_route.py

      - name: Run linter
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build release
        if: github.event_name != 'pull_request'
        run: cargo build --workspace --release --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  test:
    name: Test shard ${{ matrix.shard }}/3
    # Pinned, not ubuntu-latest: that label is moving to 26.04 (resolute), whose
    # apt reads the KiCad 10 PPA through its amd64v3 index, which carries no
    # KiCad, so it offers the archive's 9.0 and install-kicad.sh rightly
    # refuses it. Move once 26.04 resolves KiCad 10 from the PPA.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache KiCad apt packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/synth-apt
          key: ${{ runner.os }}-kicad-apt-${{ hashFiles('.github/scripts/install-kicad.sh') }}
          restore-keys: |
            ${{ runner.os }}-kicad-apt-

      - name: Install kicad-cli and the stock symbol/footprint libraries
        run: .github/scripts/install-kicad.sh

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests (shard ${{ matrix.shard }})
        run: |
          cargo nextest run --workspace --locked \
            --partition count:${{ matrix.shard }}/3

      - name: Run doctests
        if: matrix.shard == 1
        run: cargo test --workspace --locked --doc

  # The unrouted-net no-regression gate is the only signal that a placement
  # change did not make routing worse; distance metrics (HPWL, member-to-anchor
  # distance) all improved while routability regressed. It needs release mode
  # and is `#[ignore]`d, so the sharded debug run above skips it. Run it here so
  # every PR is gated. The smaller debug-mode check in
  # `crates/synth-route/tests/routability_report.rs` runs in the matrix above.
  routability-gate:
    name: Routability Gate (release)
    # Pinned, not ubuntu-latest: that label is moving to 26.04 (resolute), whose
    # apt reads the KiCad 10 PPA through its amd64v3 index, which carries no
    # KiCad, so it offers the archive's 9.0 and install-kicad.sh rightly
    # refuses it. Move once 26.04 resolves KiCad 10 from the PPA.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-routability-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache KiCad apt packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/synth-apt
          key: ${{ runner.os }}-kicad-apt-${{ hashFiles('.github/scripts/install-kicad.sh') }}
          restore-keys: |
            ${{ runner.os }}-kicad-apt-

      - name: Install kicad-cli and the stock symbol/footprint libraries
        run: .github/scripts/install-kicad.sh

      - name: Run unrouted-net no-regression gate
        run: |
          cargo test --release -p synth-route --test routability_report \
            unrouted_nets_do_not_regress --locked -- --ignored --nocapture
