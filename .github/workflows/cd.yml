name: Continuous Delivery

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  CARGO_HTTP_TIMEOUT: 60

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  bin:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the Linux binaries on Ubuntu 22.04 (glibc 2.35) so they run
          # on current server distributions such as Debian Bookworm (glibc
          # 2.36). A binary linked against a newer glibc fails to start on
          # those bases with a "GLIBC_2.x not found" error.
          - {
              os: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
              label: linux-amd64,
              ext: "",
            }
          - {
              os: ubuntu-22.04,
              target: aarch64-unknown-linux-gnu,
              label: linux-arm64,
              ext: "",
            }
          - {
              os: macos-latest,
              target: aarch64-apple-darwin,
              label: darwin-arm64,
              ext: "",
            }
          - {
              os: macos-latest,
              target: x86_64-apple-darwin,
              label: darwin-amd64,
              ext: "",
            }
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              label: windows-amd64,
              ext: ".exe",
            }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Key on the runner *image*, not just `runner.os` (always "Linux").
          # The cache holds host build-script binaries, and one compiled on a
          # newer glibc cannot run on an older one. CI fills this cache on
          # `ubuntu-latest` (24.04, glibc 2.39); without the image in the key
          # these 22.04 jobs (glibc 2.35) restore it and fail with
          # "GLIBC_2.39 not found" before compiling anything.
          shared-key: ${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install cross linker (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p synth-cli --release --locked --target ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build -p synth-cli --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/synth${{ matrix.ext }}"
          asset="synth-${{ matrix.label }}${{ matrix.ext }}"
          cp "$src" "dist/$asset"
          ( cd dist && if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi )

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: synth-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [bin]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          else
            version=$(awk '
              /^\[workspace\.package\]/ { in_section=1; next }
              /^\[/ { in_section=0 }
              in_section && /^version[[:space:]]*=/ {
                gsub(/.*=[[:space:]]*"/, "")
                gsub(/".*/, "")
                print
                exit
              }
            ' Cargo.toml)
            if [ -z "${version}" ]; then
              echo "::error::Could not read [workspace.package].version from Cargo.toml"
              exit 1
            fi
            if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::Cargo.toml version '${version}' is not semver (expected X.Y.Z)"
              exit 1
            fi
            tag="v${version}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "tag_exists=${exists}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag ${tag} (exists=${exists})"

      - name: Create and push tag if missing
        id: tag
        if: steps.version.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "chore: release version ${VERSION}"
          git push origin "refs/tags/${TAG}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created tag ${TAG}"

      - name: Decide whether to release
        id: decide
        run: |
          set -euo pipefail
          # Release when the run is on a tag, or when this run just created it
          # from a version bump on main.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ steps.tag.outputs.created }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists; skipping release."
          fi

      - name: Download all artifacts
        if: steps.decide.outputs.release == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/**
          generate_release_notes: true
          body: |
            Synth compiles text-based circuit designs (SynthSpec) into KiCad schematics, PCB layouts, and bills of materials. This release ships prebuilt CLI binaries for five platforms, each with a SHA-256 checksum.

            ## Install

            Download the binary for your platform and verify it against the matching `.sha256` file before running:

            | Platform       | Asset                     |
            | -------------- | ------------------------- |
            | Linux x86-64   | `synth-linux-amd64`       |
            | Linux arm64    | `synth-linux-arm64`       |
            | macOS arm64    | `synth-darwin-arm64`      |
            | macOS x86-64   | `synth-darwin-amd64`      |
            | Windows x86-64 | `synth-windows-amd64.exe` |

            ```bash
            # Linux
            sha256sum -c synth-linux-amd64.sha256
            # macOS
            shasum -a 256 -c synth-darwin-arm64.sha256
            # Windows (PowerShell)
            certutil -hashfile synth-windows-amd64.exe SHA256
            ```

            Then make it executable and confirm the build:

            ```bash
            chmod +x synth-linux-amd64
            ./synth-linux-amd64 --version
            ```

            ## From source

            Requires a current stable Rust toolchain.

            ```bash
            cargo install --git https://github.com/absmach/synth --tag ${{ steps.version.outputs.tag }} synth-cli
            ```

            ## Quick start

            ```bash
            synth validate fixtures/designs/hello.synth
            synth export-kicad fixtures/designs/hello.synth --out output/hello
            ```

            `synth check DESIGN.synth --json` is the deterministic, model-free gate for CI: it runs compiler validation and DRC and returns structured diagnostics with source locations. Add `--fab` to require a complete KiCad manufacturing export and receive SHA-256 hashes for the emitted files.

            ## Agent integration

            ```bash
            synth mcp --stdio
            ```

            The MCP server exposes the SynthSpec language reference, registry search, validation, fixes, and every compiler stage with structured diagnostics, so agents can iterate on a design end to end.

            ## Optional: KiCad integration

            Electrical-rule checks, schematic rendering, and fabrication outputs shell out to `kicad-cli`. Install KiCad 10 to enable them. Without it, `synth export-kicad` still generates a project, but every native check reports `unknown` rather than passing, and any command that asked for verification (`--validate-erc`, `--gerbers`/`--drill`/`--step`, `synth check --fab`) fails closed. Set `KICAD_CLI` if the binary is not on `PATH`, and `SYNTH_KICAD_CLI_TIMEOUT_SECS` to change the per-run budget (default 300s).

            ## Documentation

            - [Quick start](https://absmach.eu/docs/synth/user-guide/quick-start/)
            - [KiCad workflows](https://github.com/absmach/synth/blob/${{ steps.version.outputs.tag }}/docs/kicad-workflows.md)
            - [MCP server](https://github.com/absmach/synth/blob/${{ steps.version.outputs.tag }}/crates/synth-mcp/README.md)
            - [Component registry](https://github.com/absmach/synth/blob/${{ steps.version.outputs.tag }}/registry/README.md)

            The auto-generated list of changes and contributors follows below.
