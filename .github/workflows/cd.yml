name: Continuous Delivery

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  CARGO_HTTP_TIMEOUT: 60

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  bin:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              label: linux-amd64,
              ext: "",
            }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              label: linux-arm64,
              ext: "",
            }
          - {
              os: macos-latest,
              target: aarch64-apple-darwin,
              label: darwin-arm64,
              ext: "",
            }
          - {
              os: macos-latest,
              target: x86_64-apple-darwin,
              label: darwin-amd64,
              ext: "",
            }
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              label: windows-amd64,
              ext: ".exe",
            }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install cross linker (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p synth-cli --release --locked --target ${{ matrix.target }}

      - name: Build
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build -p synth-cli --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/synth${{ matrix.ext }}"
          asset="synth-${{ matrix.label }}${{ matrix.ext }}"
          cp "$src" "dist/$asset"
          ( cd dist && sha256sum "$asset" > "$asset.sha256" )

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: synth-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [bin]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
          body: |
            ## Install

            Download the archive for your platform, verify its checksum, and put `synth` on your `PATH`:

            ```bash
            sha256sum -c synth-linux-amd64.sha256
            chmod +x synth-linux-amd64
            ./synth-linux-amd64 --help
            ```

            Available builds: `linux-amd64`, `linux-arm64`, `darwin-amd64`, `darwin-arm64`, `windows-amd64`.

            ## From source

            ```bash
            cargo install --git https://github.com/absmach/synth --tag ${{ github.ref_name }} synth-cli
            ```

            ## Optional: KiCad integration

            Electrical-rule checks, schematic rendering, and fabrication outputs shell out to `kicad-cli`. Install KiCad 10 to enable them; without it those checks are skipped and everything else works.

            See the [README](https://github.com/absmach/synth) for the language, the MCP server, and the review workflow.
