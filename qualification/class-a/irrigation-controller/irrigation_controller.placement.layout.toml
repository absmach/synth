# Board millimetres. 12 V entry and its protection chain on the left edge,
# the two valve drivers on the right with a flyback diode each, the probe and
# flow connectors along the bottom, the MCU in the middle where the I2C bus,
# the two analogue returns and the SWD pair fan out from.
#
# Pinned hard so the board renders and routes the same on every checkout.
# These are the converged values: pinning the first placement moved F1 and
# the edge connectors, because edge legalisation runs after the override and
# a hard priority does not stop it. Re-pinning from that output is a fixed
# point.

