id = "lm74700_q1"
kind = "regulator"
description = "TI LM74700-Q1 ideal diode controller for an external N-channel MOSFET, SOT-23-6 (DBV). Pinout per datasheet SNOSD17G: 1 VCAP, 2 GND, 3 EN, 4 CATHODE, 5 GATE, 6 ANODE. ANODE is the input and the FET source, CATHODE the output and the FET drain; EN may be tied to ANODE; VCAP needs at least 0.1 uF to ANODE and 10 x the FET's Ciss; at least 22 nF at ANODE and 100 nF at CATHODE. Input 4 to 60 V, 65 V absolute maximum ANODE to GND."
