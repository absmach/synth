description = "MPS MP2307DN 3 A, 23 V, 340 kHz synchronous step-down converter, SOIC8N (exposed pad, backside tied to pin 4 GND). Pin map, ratings and package per MP2307 datasheet Rev 1.9; the exposed pad is 3.15-3.45 x 2.26-2.56 mm there, which the KiCad EP2.41x3.3mm footprint matches. KiCad ships no MP2307 symbol, and the nearest, MP2303ADN, has the same eight pins but no exposed-pad pin, so naming it would leave pad 9 unconnected; the schematic exporter draws the part from this pin map instead."
