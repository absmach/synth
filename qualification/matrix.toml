rationale = "Differential-pair constraints, placement hints, keepouts. Class-C constraint surface per #40. Manufacturing fails on KiCad DRC: 17 unconnected pads, so the router did not complete every net. A router is installed as of #95, so the DRC stage can run for the first time; nothing has observed what these report with copper on the board. The router contract changed under #39: the board's design rules now reach the engine at all, and via-in-pad is judged against the pad's copper rather than a disc of its long side. No manufacturing baseline measured before that applies, so this run establishes one."

