schema_version = "synth.qualification.v1"

# The versioned reference-board corpus (#45). Each row is a board under
# `qualification/` with the status its release command must produce; the
# runner is `scripts/run_qualification_matrix.py` and CI runs it from
# `.github/workflows/ci.yml` (the Qualification Matrix job). The schema is
# #247's, so a row moves over unchanged when the full harness lands.
#
# `expect` is the release command's verdict: "pass" means source and DRC both
# pass (a real DRC verdict with counts — a row that only reported an
# unavailable router would fail this matrix, not pass it); "fail" means the
# source gate must fail, because a negative board is a negative test, not an
# accident. `expect_fab`, when a row declares it, is the manufacturing
# stage's status under `synth check --fab`. `router` pins the engine the run
# records (see #95: a pin outranks the flag and never falls back), and
# `fab_router` names the engine whose copper the fab verdict judges.
#
# Class C and D rows have no boards in the corpus yet; the matrix runs the
# rows that exist and reports which cannot.

[matrix]
release_command = "synth check <board> --json"
fab_command = "synth check <board> --fab --json"

[[board]]
id = "negative-broken-mcu-board"
path = "qualification/class-a/negative-broken-mcu-board/negative_broken_mcu_board.synth"
class = "A"
status = "unsupported"
expect = "fail"
rationale = "A negative test: missing power pins, unconnected required pins, a duplicate designator and a value-less passive. It must fail at the source gate with E-SYNTH-CONNECT-001, E-SYNTH-NAME-001 and E-SYNTH-VALUE-001, so a compiler change cannot silently widen what a board may declare."

[[board]]
id = "i2c-sensor-node"
path = "qualification/class-a/i2c-sensor-node/i2c_sensor_node.synth"
class = "A"
status = "experimental"
expect = "pass"
router = "kicad-routing-tools"
user_registry = "reproduce/user-registry"
rationale = "STM32G030 reading a BME680 and an EEPROM over I2C, from a protected 5 V rail. Two copper layers, 57 parts. The committed evidence (README, PROVENANCE, reports) was routed by KiCadRoutingTools and passed Synth's release gate; the matrix re-runs that verdict on each revision. The parts the shipped registry does not carry are in the row's reproduce/user-registry, which the reproduce script loads too."

[[board]]
id = "protected-power-entry"
path = "qualification/class-a/protected-power-entry/protected_power_entry.synth"
class = "A"
status = "experimental"
expect = "pass"
router = "kicad-routing-tools"
user_registry = "reproduce/user-registry"
rationale = "12 V power entry through a polyfuse, TVS and reverse-polarity PFET into an MP2307 buck, a load switch and an AMS1117. Two copper layers, 84 parts, no microcontroller. The committed evidence was routed by KiCadRoutingTools and passed Synth's release gate. The parts the shipped registry does not carry are in the row's reproduce/user-registry."

[[board]]
id = "buck"
path = "qualification/class-b/buck/buck.synth"
class = "B"
status = "experimental"
expect = "pass"
expect_fab = "fail"
router = "freerouting"
fab_router = "kicad-routing-tools"
flags = ["--allow-unverified-parts"]
rationale = "24 V in, 3.3 V out buck (LMR38010) with a PTC, reverse-block Schottky and TVS on the input, an EN divider, feedback, power-good and a thermal via array under the exposed pad. The FreeRouting copper is complete and `kicad-cli pcb drc` reports 0 errors and 0 warnings, so source and DRC pass. Manufacturing with KiCadRoutingTools copper leaves 11 signal vias without a ground return via (W-SYNTH-DRC-016), so the fab run is expected to fail as a negative test. The board stays `experimental`: no human has signed off its artifacts."

[[board]]
id = "usb-uart"
path = "qualification/class-b/usb-uart/usb_uart.synth"
class = "B"
status = "experimental"
skip_reason = "cannot run on this branch: the source gate rejects the board with E-SYNTH-POWER-010 (rail load exceeds the regulator's current limit — the LP5907 LDO feeding VIO). The committed evidence predates that rule; the row stays here, unrun, until the board or the rule decides the mismatch."
rationale = "USB-C dual CH342F UART plus a THVD1450 RS-485 transceiver, with the protection parts the registry has. The committed evidence was routed by FreeRouting and passed Synth's release gate at its recorded revision; the parts carry no registry review records."

[[board]]
id = "rtd-afe"
path = "qualification/class-b/rtd-afe/rtd_afe.synth"
class = "B"
status = "experimental"
expect = "pass"
router = "freerouting"
flags = ["--allow-unverified-parts"]
rationale = "PT100 four-wire RTD front end (ADS124S08, REF5025, RP2350 as the host side). The committed evidence was routed by FreeRouting and passed Synth's release gate with the parts reviewed in the registry; its own QUALIFICATION.md records what is still open (SI/PI review, the current tree does not reproduce the committed package). The matrix asserts the gate verdict, not the historical package."
