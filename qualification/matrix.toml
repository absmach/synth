schema_version = "synth.qualification.v1"

# The versioned reference-board corpus (#45). Each row is a board under
# `qualification/` with the status its release command must produce; the
# runner is `scripts/run_qualification_matrix.py` and CI runs it from
# `.github/workflows/ci.yml` (the Qualification Matrix job). The schema is
# #247's, so a row moves over unchanged when the full harness lands.
#
# `expect` is the release command's verdict: "pass" means source and DRC both
# pass (a real DRC verdict with counts — a row that only reported an
# unavailable router would fail this matrix, not pass it); "fail" means the
# source gate must fail, because a negative board is a negative test, not an
# accident. `expect_fab`, when a row declares it, is the manufacturing
# stage's status under `synth check --fab`. `router` pins the engine the run
# records (see #95: a pin outranks the flag and never falls back), and
# `fab_router` names the engine whose copper the fab verdict judges.
#
# A row the corpus cannot run on this code declares `skip_reason`: the runner
# records it and names it in the log, never silently dropping it, because
# what cannot run is part of what the matrix reports. Every skip below was
# verified on this branch on 2026-11-13 (KiCad 10.0.8, KiCadRoutingTools
# 9399bfb, FreeRouting 2.4.1) and says exactly what blocked it.
#
# Class C and D rows have no boards in the corpus yet; the matrix runs the
# rows that exist and reports which cannot.

[matrix]
release_command = "synth check <board> --json"
fab_command = "synth check <board> --fab --json"

[[board]]
id = "negative-broken-mcu-board"
path = "qualification/class-a/negative-broken-mcu-board/negative_broken_mcu_board.synth"
class = "A"
status = "unsupported"
expect = "fail"
rationale = "A negative test: missing power pins, unconnected required pins, a duplicate designator and a value-less passive. It must fail at the source gate with E-SYNTH-CONNECT-001, E-SYNTH-NAME-001 and E-SYNTH-VALUE-001, so a compiler change cannot silently widen what a board may declare."

[[board]]
id = "i2c-sensor-node"
path = "qualification/class-a/i2c-sensor-node/i2c_sensor_node.synth"
class = "A"
status = "experimental"
skip_reason = "the route does not validate on this branch: with KiCadRoutingTools 9399bfb (the corpus's pinned revision), the routed board is rejected with 99 blocking findings — one copper-to-edge DRC error (0.270 mm against the 0.300 mm rule), signal vias without a ground return via, and an untied GND island. The committed evidence passed at synth 0ceb7b80, KiCad 10.0.6. The row stays here, unrun, until the route validates again."
rationale = "STM32G030 reading a BME680 and an EEPROM over I2C, from a protected 5 V rail. Two copper layers, 57 parts. The parts the shipped registry does not carry are in the row's reproduce/user-registry, which the reproduce script loads too."

[[board]]
id = "protected-power-entry"
path = "qualification/class-a/protected-power-entry/protected_power_entry.synth"
class = "A"
status = "experimental"
skip_reason = "the release verdict is not established on this branch: the source gate passes with the row's user registry loaded, but its 84-part route did not complete within the local budget, so no DRC verdict exists to assert. The row stays here, unrun, until a machine that can route it within budget re-establishes the verdict."
rationale = "12 V power entry through a polyfuse, TVS and reverse-polarity PFET into an MP2307 buck, a load switch and an AMS1117. Two copper layers, 84 parts, no microcontroller. The parts the shipped registry does not carry are in the row's reproduce/user-registry."

[[board]]
id = "buck"
path = "qualification/class-b/buck/buck.synth"
class = "B"
status = "experimental"
skip_reason = "the route/DRC verdict is not established on this branch: with the matrix's pinned router the DRC stage is unknown and the manufacturing stage fails, so the row cannot assert the committed pass. The row stays here, unrun, until the route and release verdict are re-established."
rationale = "24 V in, 3.3 V out buck (LMR38010) with a PTC, reverse-block Schottky and TVS on the input, an EN divider, feedback, power-good and a thermal via array under the exposed pad. The FreeRouting copper routes with 0 DRC errors and 0 unconnected items, so source and DRC pass (verified 2026-11-13). The manufacturing package also passes the gate on this branch with KiCadRoutingTools 9399bfb — the 11 return-via findings the committed record describes no longer reproduce at that revision. The board stays `experimental`: no human has signed off its artifacts, and docs/qualification-followups.md keeps the review gates open."

[[board]]
id = "usb-uart"
path = "qualification/class-b/usb-uart/usb_uart.synth"
class = "B"
status = "experimental"
skip_reason = "cannot run on this branch: the source gate rejects the board with E-SYNTH-POWER-010 (rail load exceeds the regulator's current limit — the LP5907 LDO feeding VIO). The committed evidence predates that rule; the row stays here, unrun, until the board or the rule decides the mismatch."
rationale = "USB-C dual CH342F UART plus a THVD1450 RS-485 transceiver, with the protection parts the registry has. The committed evidence was routed by FreeRouting and passed Synth's release gate at its recorded revision; the parts carry no registry review records."

[[board]]
id = "rtd-afe"
path = "qualification/class-b/rtd-afe/rtd_afe.synth"
class = "B"
status = "experimental"
skip_reason = "the route does not validate on this branch: the FreeRouting copper leaves +3V3 and VREG_LX open, an untied GND island and signal vias without ground return vias — 13 blocking findings (verified 2026-11-13 with FreeRouting 2.4.1). The board's own README already records that the current tree does not route. The row stays here, unrun, until the route validates again."
rationale = "PT100 four-wire RTD front end (ADS124S08, REF5025, RP2350 as the host side). The committed evidence was routed by FreeRouting and passed Synth's release gate at its recorded revision, with the parts reviewed in the registry; its own README records what is still open (SI/PI review, historical committed package)."
