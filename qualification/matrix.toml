schema_version = "synth.qualification.v1"

# Only the Class-B buck board (SYN-67) is declared here. The full reference
# matrix and its harness are in #247; this file uses #247's schema so the row
# moves over unchanged when that lands.[matrix]
release_command = "synth check <board> --json"
fab_command = "synth check <board> --fab --json"

[[board]]
id = "buck"
path = "qualification/class-b/buck/buck.synth"
class = "B"
status = "experimental"
expect = "pass"
expect_fab = "fail"
rationale = "24 V in, 3.3 V out buck (LMR38010) with a PTC, reverse-block Schottky and TVS on the input, an EN divider, feedback, power-good and a thermal via array under the exposed pad. The FreeRouting copper is complete and `kicad-cli pcb drc` reports 0 errors and 0 warnings, so source and DRC pass. Every part with a registry record is reviewed. Manufacturing still fails under `synth check --fab`, which routes with KiCadRoutingTools: that copper leaves 11 signal vias without a ground return via (W-SYNTH-DRC-016), so the release is validation_failed. The board stays `experimental`: no human has signed off its artifacts."

[[board]]
id = "bldc-stack"
path = "qualification/class-d/bldc-stack/control.synth"
class = "D"
status = "experimental"
expect = "fail"
expect_fab = "fail"
rationale = "Two boards (bldc_control and bldc_power) joined by a 2 x 10 J_B2B. The control board is an STM32G030K8, AMS1117-3.3, THVD1450D RS-485, Hall/encoder inputs and an SWD header; the power board is a 24 V / 10 A three-phase stage with BSC030N08NS5 MOSFETs, IR2101 gate drivers, 5 mOhm shunts, MCP6022 current sense, an LMR38010 12 V buck and an SMBJ30A input clamp. Both sources validate with 0 errors and the multiboard check matches 20/20 J_B2B pins; the four negative mappings are rejected. The release is still `fail`: the FreeRouting adapter crashes in this environment on the committed Class-B buck board too, so no copper exists, the power PCB/BOM are missing, and `synth check --fab` fails in manufacturing. The board stays `experimental`: no human has signed off its artifacts and every authored part has an empty reviewer."
