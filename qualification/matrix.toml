schema_version = "synth.qualification.v1"

# The Class-B buck board (SYN-67) and the usb-uart board (SYN-66) are declared
# here. The full reference matrix and its harness are in #247; this file uses
# #247's schema so the rows move over unchanged when that lands.
[matrix]
release_command = "synth check <board> --json"
fab_command = "synth check <board> --fab --json"

[[board]]
id = "buck"
path = "qualification/class-b/buck/buck.synth"
class = "B"
status = "experimental"
expect = "pass"
expect_fab = "fail"
rationale = "24 V in, 3.3 V out buck (LMR38010) with a PTC, reverse-block Schottky and TVS on the input, an EN divider, feedback, power-good and a thermal via array under the exposed pad. The FreeRouting copper is complete and `kicad-cli pcb drc` reports 0 errors and 0 warnings, so source and DRC pass. Every part with a registry record is reviewed. Manufacturing still fails under `synth check --fab`, which routes with KiCadRoutingTools: that copper leaves 11 signal vias without a ground return via (W-SYNTH-DRC-016), so the release is validation_failed. The board stays `experimental`: no human has signed off its artifacts."

[[board]]
id = "usb-uart"
path = "qualification/class-b/usb-uart/usb_uart.synth"
class = "B"
status = "experimental"
skip_reason = "the source gate rejects the board with E-SYNTH-POWER-010 (the LP5907 LDO feeding VIO is counted against a load envelope the committed evidence predates). The row stays here, unrun, until the board or the rule decides the mismatch."
rationale = "USB-C dual CH342F UART plus a THVD1450 RS-485 transceiver, with the protection parts the registry has. The committed evidence was routed by FreeRouting and passed Synth's release gate at its recorded revision."

[[board]]
id = "multirail-compute-node"
path = "qualification/class-c/multirail-compute-node/multirail_compute_node.synth"
class = "C"
status = "experimental"
skip_reason = "not run by this job: the route takes longer than the CI budget, so no verdict is asserted here. The committed package comes from the author's own export."
rationale = "Multi-rail compute node (STM32F103C8, USB-C, a 4 A buck and three linear rails, four layers). Its package comes from the author's `synth export-kicad` run; the route takes longer than the CI budget, so the matrix does not run it. See its QUALIFICATION.md for what is and is not claimed."
