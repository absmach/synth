schema_version = "synth.qualification.v1"

# Pinned so that a part edit fails the pull request that made it: every board
# compiles against the registry, so any of the verdicts or artifacts below can
# move with it. `synth registry manifest | sha256sum`.
[baseline]
registry_manifest_sha256 = "0b3786a15a9e87ae8024d2f69c365724de207fabf468ed1a86730089fe0f0b33"

[matrix]
release_command = "synth check <board> --json"
fab_command = "synth check <board> --fab --json"

# Every `expect` and `expect_fab` below was measured, not assumed. The run:
# KiCad 10.0.8, KiCadRoutingTools v0.23.0 (grid_router 9399bfb), release build,
# `synth check <board> --json [--fab] --router kicad-routing-tools`.
#
# No board in the corpus currently clears the gate. That is the finding, not a
# gap in the corpus: `status` says what each board is here to demonstrate and
# `expect` says what the release command does today, so the two disagreeing is
# exactly the state this file exists to make visible.

[[board]]
id = "hello"
path = "fixtures/designs/hello.synth"
fixture_sha256 = "a1047d5b79020d3b100c389ff4e97ebce5d15cf9badad9b15b41ab6d2b474706"
expect_artifacts = { "bom.csv" = "9ad8239fa3db9939c350c38e50ed1882b2852568e60b5202404ce06d526b6d18", "hello.kicad_sch" = "fe346fc3e44404875d97955d0ec0e0bbf52afe9a41df4a1bf54278548d2a9972" }
expect_geometry = { "drill" = "f2fdb18e17327dbb598a888e518839aee7f82f951c80c0d8931b82cef6d2d1de", "gerbers" = "8d296f8a79f9805aee8a5d2f977a852b64c1be8b1e2b770cd3d199307e8eca25", "hello.kicad_pcb" = "0b9afaa04d7b0bd13adae81598ea99d8178c3e7f3b6fe4d8173162da5044d998", "hello.synth.kicad_pcb" = "0b9afaa04d7b0bd13adae81598ea99d8178c3e7f3b6fe4d8173162da5044d998" }
class = "A"
status = "experimental"
expect = "fail"
expect_fab = "fail"
rationale = "`board \"hello\" { layers 2 }` — no components, no nets. It is here to prove the release command itself runs end to end, which it does: the source stage passes. The route stage then exits 1 on a board with nothing to route, so the DRC stage reports `unknown`, which is not a pass, and manufacturing fails carrying that routing failure. A board with nothing to route should route trivially; see #98."

[[board]]
id = "env_logger"
path = "examples/env_logger/env_logger.synth"
fixture_sha256 = "b89025f6eb05df789c317eb875f0efb6df86a85c61d48bf708b76972ec0f50d1"
expect_artifacts = { "bom.csv" = "f370dec99c97f8a3a13439d4ca05b2c5d8233b0a4f69a43c400abf50f2c68bba", "env_logger.kicad_sch" = "086e8ae14f4520da5a25e8c272552e5bb31a8f8a6dd14e163d9a7ac4ca0cccbf" }
expect_geometry = { "drill" = "7875075ddd41bc05bf69345d8b7e2aef260dc61af43ed360fc6ac702a502548d", "env_logger.kicad_pcb" = "c2d29d309e54fc22bb815eb98dc840a7edb8c3f24574e8064d37aa649e44a9c9", "env_logger.kicadroutingtools.kicad_pcb" = "5b4fb18909c10acbc9a60902700af17581dfa8cabc82ec302739d718b10eb347", "env_logger.synth.fanned0.kicad_pcb" = "49dbe66645172cf795a732f105ca8a51bb679b25db558ea08c408c68beeb78d5", "env_logger.synth.fanned1.kicad_pcb" = "19ef2c0425e12537b4c2f62f4430d2ece7bfc5199a290874ff02292ba38df00a", "env_logger.synth.kicad_pcb" = "c2d29d309e54fc22bb815eb98dc840a7edb8c3f24574e8064d37aa649e44a9c9", "env_logger.synth.poured.kicad_pcb" = "9cce322673868e432caf360c489cdeaedbcc52206fdec1ee6879b22f6d01aaae", "gerbers" = "1f7467c8d9036cd8695384b68f0150cb319af4e06aeb685c620f12477ebcfe15" }
class = "A"
status = "experimental"
expect = "fail"
expect_fab = "fail"
rationale = "USB-C power, an AMS1117 LDO, an MCU, a BME680 on I2C and a debug header: the Class-A envelope. Source passes. On the 10.0.6 baseline this board routed clean; under KiCad 10.0.8 with KiCadRoutingTools 9399bfb the routed board leaves 35 pads with no copper path, so independent validation reports validation_failed and the DRC stage reports `unknown`, which is not a pass. Manufacturing fails for the same routing failure. That is a routing regression against the previous baseline, recorded here so the corpus states it instead of hiding it."

