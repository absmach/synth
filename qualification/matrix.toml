[[board]]
id = "buck"
path = "qualification/class-b/buck/buck.synth"
fixture_sha256 = "309b4839f4ea0dc1f0d86608d2c731c5a9ff9ac725331360d5e7fb095609c8b0"
expect_artifacts = { "bom.csv" = "2a4faa316306140a1e6178fcf388840e6913b05edd23a92547fcd7f0b80dadce", "buck.kicad_sch" = "0c4bf60be83892bc186e555484b0b65c9c6ab9aa0d2b5c99a2e6fcc7bb77bc45" }
expect_geometry = { "buck.kicad_pcb" = "b01ba9cc01ebc8c71d17627c12981b7d5c439ddd26a3f15f7b3e259a8586247b", "buck.synth.fanned0.kicad_pcb" = "5931a85a37f618470d5f4387fbc7c5e331dac20bfb637f92e181ce3795018dda", "buck.synth.kicad_pcb" = "36fde1ba7050ecd8524f9ce7ca413f80094a1d97019dea9d57bbe0323370cbcf", "buck.synth.poured.kicad_pcb" = "5931a85a37f618470d5f4387fbc7c5e331dac20bfb637f92e181ce3795018dda", "drill" = "d5eebcbd758709a16391594553b8c1568fecccf2d7b659b6b54ee6d27b0c9350", "gerbers" = "fb7aeafd44f0ab041216c8891662ea797eae540d6a7582f875f6912701b402d9" }
