schema_version = "synth.qualification.v1"

[matrix]
release_command = "synth check <board> --json"
fab_command = "synth check <board> --fab --json"

[[board]]
id = "hello"
path = "fixtures/designs/hello.synth"
class = "A"
status = "qualified"
expect = "fail"
expect_fab = "unestablished"
rationale = "Smallest valid board declaration. Proves the release command itself is sound. First routed run: the DRC stage reported `unknown` on this empty board, so the gate fails. Recorded, not accepted — see #98. The router contract changed under #39: the board's design rules now reach the engine at all, and via-in-pad is judged against the pad's copper rather than a disc of its long side. No manufacturing baseline measured before that applies, so this run establishes one."

[[board]]
id = "env_logger"
path = "examples/env_logger.synth"
class = "A"
status = "experimental"
expect = "pass"
expect_fab = "unestablished"
rationale = "USB-C power, LDO, MCU, I2C sensor, debug header. The Class-A envelope in #39. Manufacturing fails on E-SYNTH-QUAL-000: a part's pin map disagrees with its KiCad footprint. Manufacturing was E-SYNTH-QUAL-000 on bme680_env and stm32f103c8; both pin maps are now complete, so no baseline applies. A router is installed as of #95, so the DRC stage can run for the first time; nothing has observed what these report with copper on the board. The router contract changed under #39: the board's design rules now reach the engine at all, and via-in-pad is judged against the pad's copper rather than a disc of its long side. No manufacturing baseline measured before that applies, so this run establishes one."

