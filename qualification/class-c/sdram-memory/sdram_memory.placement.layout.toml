schema_version = 2
# Hand floorplan for the x32 SDRAM card, applied after the solver.
#
# The card is laid out the way a memory module is: the command connector on
# one edge with its twenty-four damping resistors in two columns beside the
# pins they damp, the data connector on the other, the two dice stacked
# between them so each faces its own half of the data bus, one decoupling
# column per rail per die, and the sideband — presence detect, thermal and
# the supply entry — filling the space beside the dice that the bus does not
# need.

