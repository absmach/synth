[workspace]
resolver = "2"
members = [
  "crates/synth-cli",
  "crates/synth-diagnostics",
  "crates/synth-ast",
  "crates/synth-parser",
  "crates/synth-ir",
  "crates/synth-geometry",
  "crates/synth-layout",
  "crates/synth-registry",
  "crates/synth-knowledge",
  "crates/synth-validate",
  "crates/synth-kicad",
  "crates/synth-place",
  "crates/synth-pcb",
  "crates/synth-router",
  "crates/synth-drc",
  "crates/synth-mcp",
  "crates/synth-render",
  "crates/synth-smt",
  "crates/synth-connectivity",
  "crates/synth-supply",
  "crates/synth-cost",
  "crates/synth-sim",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/synth-eda/synth"
authors = ["The Synth Authors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Carve-outs: these pedantic lints conflict with deliberate design choices.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Spans are intentionally u32 (file size capped at 1 MB).
# usize→u32 casts are bounded by precondition, not a truncation risk.
cast_possible_truncation = "allow"
# Builder pattern is the workspace convention; #[must_use] on every
# fluent method is noise.
return_self_not_must_use = "allow"
# Exact float equality is required in serde round-trip and snapshot tests.
float_cmp = "allow"
# New in Rust 1.100. `assert!(x.is_empty())` reads better in tests than the
# suggested `assert_eq!(x, [] as [T; 0])`.
assert_is_empty = "allow"
# Product/proper nouns (SynthSpec, KiCad, ...) are intentionally not
# backticked in prose documentation.
doc_markdown = "allow"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
thiserror = "2.0"
anyhow = "1.0"
rayon = "1.12"

# Structured logging. Library crates only emit events; the binary installs
# the subscriber, so the same diagnostics can be filtered, captured by a
# host, or silenced without changing what is printed where.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Deterministic rasterization for the schematic visual-feedback loop
# (synth-render). Pinned exactly: a resvg bump that moves one antialiased
# edge would read as visual drift in a stored baseline.
resvg = "=0.49.0"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"

clap = { version = "4.6", features = ["derive"] }
insta = { version = "1.48", features = ["json", "yaml"] }
proptest = "1.11"
toml = "1.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zip = { version = "9.0", default-features = false }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "signal",
  "time",
  "io-std",
  "io-util",
] }
axum = "0.8"
include_dir = "0.7"
schemars = "1.2"

# Workspace crates referenced by path
synth-diagnostics = { path = "crates/synth-diagnostics", version = "0.1.3" }
synth-ast = { path = "crates/synth-ast", version = "0.1.3" }
synth-parser = { path = "crates/synth-parser", version = "0.1.3" }
synth-ir = { path = "crates/synth-ir", version = "0.1.3" }
synth-geometry = { path = "crates/synth-geometry", version = "0.1.3" }
synth-layout = { path = "crates/synth-layout", version = "0.1.3" }
synth-registry = { path = "crates/synth-registry", version = "0.1.3" }
synth-knowledge = { path = "crates/synth-knowledge", version = "0.1.3" }
synth-validate = { path = "crates/synth-validate", version = "0.1.3" }
synth-kicad = { path = "crates/synth-kicad", version = "0.1.3" }
synth-place = { path = "crates/synth-place", version = "0.1.3" }
synth-router = { path = "crates/synth-router", version = "0.1.3" }
synth-pcb = { path = "crates/synth-pcb", version = "0.1.3" }
synth-drc = { path = "crates/synth-drc", version = "0.1.3" }
synth-mcp = { path = "crates/synth-mcp", version = "0.1.3" }
synth-render = { path = "crates/synth-render", version = "0.1.3" }
synth-smt = { path = "crates/synth-smt", version = "0.1.3" }
synth-supply = { path = "crates/synth-supply", version = "0.1.3" }
synth-cost = { path = "crates/synth-cost", version = "0.1.3" }
synth-sim = { path = "crates/synth-sim", version = "0.1.3" }

[profile.release]
lto = "thin"
codegen-units = 1

# Optimize the test profile: the golden/export suites drive the closed-loop
# place+route repair engine over many boards, which is 5-15x slower at
# opt-level 0. opt-level 1 keeps debug assertions on (correctness checks
# intact) while collapsing test wall-clock — the single biggest CI lever.
#
# incremental = false is required, not just cosmetic: incremental codegen
# intermittently emits LLVM `anon.*.llvm.*` symbols with hidden visibility,
# which rust-lld then reports as "undefined hidden symbol" when linking the
# test binaries. That breaks the suite non-deterministically, so tests build
# without incremental state.
[profile.test]
opt-level = 1
incremental = false
