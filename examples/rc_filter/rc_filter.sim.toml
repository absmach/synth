# Testbench for examples/rc_filter/rc_filter.synth.
ground = "GND"

[[source]]
net = "IN"
kind = "dc"
dc = 0.0
ac = 1.0

[analysis.ac]
start = 10.0
stop = 100000.0
points_per_decade = 100

[[measure]]
name = "corner"
kind = "relative_db"
node = "OUT"
min = 1560.0
max = 1620.0

[[measure]]
name = "passband"
kind = "node_voltage"
node = "OUT"
at_frequency = 159.0
min = -0.5
max = 0.0

[[measure]]
name = "stopband"
kind = "node_voltage"
node = "OUT"
at_frequency = 15900.0
min = -23.0
max = -17.0
